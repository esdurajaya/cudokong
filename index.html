<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CUDOK The Kong</title>

<style>
body {
    margin: 0;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
}

#game {
    width: 100%;
    max-width: 480px;
    text-align: center;
}

img {
    width: 100%;
    max-height: 70vh;
    object-fit: contain;
    transition: opacity 0.3s;
}

#buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 12px;
}

/* tombol */
.btn {
    min-width: 130px;
    height: 48px;
    padding: 0 16px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.btn:active {
    transform: scale(0.95);
}

/* warna */
.give { background:#2ecc71; color:#fff; }
.shoot { background:#e74c3c; color:#fff; }
.no { background:#7f8c8d; color:#fff; }
.restart { background:#3498db; color:#fff; }

/* sembunyi mutlak */
.hidden {
    display: none !important;
}

/* flash */
#flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="flash"></div>

<div id="game">
    <img id="gif" src="1.gif">
    <div id="buttons">
        <button id="give" class="btn give">💸 Bere Kasbon</button>
        <button id="shoot" class="btn shoot hidden">🔫 Bedil weh</button>
        <button id="no" class="btn no hidden">❌ montong</button>
        <button id="restart" class="btn restart hidden">🔁 Maen deui</button>
    </div>
</div>

<audio id="clickSound" src="click.wav"></audio>
<audio id="shotSound" src="shot.wav"></audio>

<script>
const gif = document.getElementById("gif");
const give = document.getElementById("give");
const shoot = document.getElementById("shoot");
const noBtn = document.getElementById("no");
const restart = document.getElementById("restart");
const buttons = document.getElementById("buttons");
const flash = document.getElementById("flash");
const clickSound = document.getElementById("clickSound");
const shotSound = document.getElementById("shotSound");

/* util */
function fadeTo(src) {
    gif.style.opacity = 0;
    setTimeout(() => {
        gif.src = src;
        gif.style.opacity = 1;
    }, 200);
}

function hideAllButtons() {
    give.classList.add("hidden");
    shoot.classList.add("hidden");
    noBtn.classList.add("hidden");
    restart.classList.add("hidden");
}

/* reset */
function resetGame() {
    fadeTo("1.gif");
    buttons.classList.remove("hidden");
    hideAllButtons();
    give.classList.remove("hidden");
}

/* kasih uang */
give.onclick = () => {
    clickSound.play();
    hideAllButtons();

    fadeTo("2.gif");

    setTimeout(() => fadeTo("1.gif"), 2000);

    setTimeout(() => {
        fadeTo("3.gif");
        shoot.classList.remove("hidden");
        noBtn.classList.remove("hidden");
    }, 4500);
};

/* tembak */
shoot.onclick = () => {
    shotSound.play();

    if (navigator.vibrate) {
        navigator.vibrate([200,100,200,100,300]);
    }

    hideAllButtons();
    buttons.classList.add("hidden");

    flash.style.opacity = 1;
    setTimeout(() => flash.style.opacity = 0, 100);

    fadeTo("4.gif");

    setTimeout(() => {
        fadeTo("5.gif");
        buttons.classList.remove("hidden");
        restart.classList.remove("hidden"); // ⬅️ HANYA INI
    }, 1000);
};

/* tidak */
noBtn.onclick = () => {
    clickSound.play();
    resetGame();
};

/* main lagi */
restart.onclick = () => {
    clickSound.play();
    resetGame();
};
</script>

</body>
</html>
